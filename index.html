  function generateAndPrint() {
    var ids = Array.from(view.selected);
    if (!ids.length) return;
    renderPrintCards(ids, PSCOPE.lanyard.st);
    if (BACKEND_URL) {
      setConnStatus("Marking printed…", false);
      apiPost({ action: "markPrinted", ids: ids }).then(function (res) {
        if (res && res.ok) {
          var stamp = nowTime();
          ids.forEach(function (id) {
            var r = byId(state.registrants, id);
            if (r) { r.qrPrinted = true; r.qrPrintedAt = stamp; }
          });
          setConnStatus("Connected — live off the test Sheet", true);
        } else {
          setConnStatus("Marking printed failed — " + (res && res.error), false);
        }
        finishPrint(ids);
      }).catch(function (err) { setConnStatus("Marking printed failed — " + err, false); finishPrint(ids); });
      return;
    }
    ids.forEach(function (id) {
      var r = byId(state.registrants, id);
      if (r) { r.qrPrinted = true; r.qrPrintedAt = nowTime(); }
    });
    finishPrint(ids);
  }

  // Print tab "Reset printing": everyone back to not printed (walk-ins keep their blank card).
  function resetPrinted() {
    var targets = state.registrants.filter(function (r) { return !r.walkin; });
    var wasPrinted = targets.filter(function (r) { return r.qrPrinted; }).length;
    var applyLocal = function () {
      targets.forEach(function (r) { r.qrPrinted = false; r.qrPrintedAt = null; });
      view.selected = new Set();
    };
    if (!BACKEND_URL) {
      applyLocal();
      view.printToast = "Printing reset \u2014 " + wasPrinted + " lanyard" + (wasPrinted === 1 ? "" : "s") + " marked not printed.";
      render();
      return;
    }
    setConnStatus("Resetting printing\u2026", false);
    view.printToast = "Resetting\u2026";
    render();
    apiPost({ action: "resetPrinted" }).then(function (res) {
      if (res && res.ok) {
        applyLocal();
        var n = typeof res.reset === "number" ? res.reset : wasPrinted;
        view.printToast = "Printing reset \u2014 " + n + " lanyard" + (n === 1 ? "" : "s") + " marked not printed.";
        setConnStatus("Connected \u2014 live off the test Sheet", true);
      } else {
        view.printToast = "Couldn\u2019t reset \u2014 the Sheet script needs the reset update (" + (res && res.error) + "). Nothing was changed.";
        setConnStatus("Reset failed \u2014 " + (res && res.error), false);
      }
      render();
    }).catch(function (err) {
      view.printToast = "Couldn\u2019t reach the Sheet (" + err + "). Nothing was changed.";
      setConnStatus("Reset failed \u2014 " + err, false);
      render();
    });
  }

        '<button class="back-link" data-action="cancelWalkin" type="button">&larr; Cancel</button>' +
        '<h2 class="screen-title">New walk-in</h2>' +
        '<div class="walkin-card">' +
          '<div class="walkin-code">' +
            '<span class="walkin-code-label">Blank card</span>' +
            '<span class="walkin-code-id mono">' + esc(wk.id) + '</span>' +
          '</div>' +
          '<label class="walkin-field">Full name (as they wrote it on the card)' +
            '<input class="text-input" id="walkinName" type="text" autocomplete="off" autocapitalize="words" maxlength="80" value="' + esc(wk.name) + '">' +
          '</label>' +
          '<label class="walkin-field">Ward or stake <span style="color:var(--muted);font-weight:400">(optional)</span>' +
            '<input class="text-input" id="walkinWard" type="text" autocomplete="off" autocapitalize="words" maxlength="80" value="' + esc(wk.ward) + '">' +
          '</label>' +
          '<div class="walkin-photo">' +
            '<div class="walkin-photo-preview">' + photoInner + '</div>' +
            '<div class="walkin-photo-text">' +
              '<span>' + (wk.photo ? 'Photo taken. Retake it if their face isn’t clear.' : 'Take a clear photo of their face — security uses it to identify them.') + '</span>' +
              '<label class="btn btn-sm" for="walkinPhotoInput" style="align-self:flex-start">' + (wk.photo ? 'Retake photo' : 'Take photo') + '</label>' +
              '<input class="walkin-photo-input" id="walkinPhotoInput" type="file" accept="image/*" capture="environment">' +
            '</div>' +
          '</div>' +
          (wk.error ? '<div class="field-error">' + esc(wk.error) + '</div>' : '') +
          '<button class="btn btn-primary btn-block btn-lg" data-action="saveWalkin" type="button"' + (wk.saving || wk.photoBusy ? ' disabled' : '') + '>' +
            (wk.saving ? 'Saving&hellip;' : 'Sign them up') +
          '</button>' +
          '<div class="walkin-note">After this, scanning ' + esc(wk.id) + ' brings up their name and photo like any other lanyard.</div>' +
        '</div>';

      var wName = document.getElementById("walkinName");
      var wWard = document.getElementById("walkinWard");
      var wPhoto = document.getElementById("walkinPhotoInput");
      if (wName) wName.addEventListener("input", function () { wk.name = wName.value; });
      if (wWard) wWard.addEventListener("input", function () { wk.ward = wWard.value; });
      if (wPhoto) wPhoto.addEventListener("change", function () { if (wPhoto.files && wPhoto.files[0]) loadWalkinPhoto(wPhoto.files[0]); });
      return;
    }

    if (view.screen === "pin") {
      caption.textContent = "The print tab is limited to committee members.";
      el.innerHTML =
        '<button class="back-link" data-action="pinBack" type="button">&larr; Back</button>' +
        '<div class="pin-wrap">' +
          '<div class="pin-lock">&#128274;</div>' +
          '<h2 class="screen-title">Staff access</h2>' +
          '<p class="screen-sub" style="margin:0">Enter the committee PIN to print lanyards.</p>' +
          '<input class="pin-input" id="pinInput" type="password" inputmode="numeric" maxlength="8" autocomplete="off">' +
          (view.pinError ? '<div class="field-error">Incorrect PIN — try again.</div>' : '<div class="field-error"></div>') +
          '<button class="btn btn-primary" data-action="submitPin" type="button">Unlock</button>' +
          '<div class="pin-hint">Demo PIN: ' + DEMO_PIN + ' (a real one will replace this before the convention)</div>' +
        '</div>';
      var pinInput = document.getElementById("pinInput");
      if (pinInput) {
        pinInput.focus();
        pinInput.addEventListener("keydown", function (e) {
          if (e.key === "Enter") submitPin(pinInput.value);
        });
      }
      return;
    }
  }

  // ---------- rendering: sheet panels ----------

  function renderSheets() {
    var rBody = document.getElementById("registrantsBody");
    rBody.innerHTML = state.registrants.map(function (r) {
      var cls = r.id === lastUpdatedRegistrant || lastPrintedBatch.indexOf(r.id) !== -1 ? " class=\"just-updated\"" : "";
      var printed = r.qrPrinted
        ? '<span class="pill pill-success pill-sm">Yes</span>'
        : '<span class="pill pill-neutral pill-sm">No</span>';
      var checkin = r.checkedIn
        ? '<span class="pill pill-success"><span class="pill-dot"></span>' + esc(r.checkedInAt) + '</span>'
        : '<span class="pill pill-neutral"><span class="pill-dot"></span>Not yet</span>';
      var bookings = r.bookings.length
        ? r.bookings.map(function (aid) { var a = byId(state.activities, aid); return a ? esc(a.name) : aid; }).join(", ")
        : '<span class="cell-muted">None</span>';
      var lost = r.lost
        ? '<span class="pill pill-critical pill-sm">&#128680; ' + esc(r.lostAt) + '</span>'
        : '<span class="pill pill-neutral pill-sm">No</span>';
      var dietaryCell = r.dietary
        ? '<span class="pill pill-warning pill-sm">' + esc(r.dietary) + '</span>'
        : '<span class="cell-muted">None</span>';
      return "<tr" + cls + ">" +
        "<td>" + esc(r.name) + "</td>" +
        "<td class=\"cell-muted\">" + esc(r.ward) + "</td>" +
        "<td class=\"cell-id mono\">" + esc(r.id) + "</td>" +
        "<td>" + dietaryCell + "</td>" +
        "<td>" + printed + "</td>" +
        "<td>" + checkin + "</td>" +
        "<td>" + lost + "</td>" +
        "<td>" + bookings + "</td>" +
      "</tr>";
    }).join("");
    lastPrintedBatch = [];

    var aBody = document.getElementById("activitiesBody");
    aBody.innerHTML = state.activities.map(function (a) {
      var cap = capacityState(a);
      var cls = a.id === lastUpdatedActivity ? " class=\"just-updated\"" : "";
      var fillClass = cap.status === "full" ? "is-critical" : (cap.status === "near" ? "is-warning" : "");
      var statusPill = cap.status === "full"
        ? '<span class="pill pill-critical">Full</span>'
        : (cap.status === "near" ? '<span class="pill pill-warning">Nearly full</span>' : '<span class="pill pill-success">Open</span>');
      return "<tr" + cls + ">" +
        "<td>" + esc(a.name) + "</td>" +
        "<td class=\"cell-muted\">" + esc(a.time) + "</td>" +
        "<td>" +
          '<div class="capacity-row" style="min-width:140px">' +
            '<div class="capacity-track"><div class="capacity-fill ' + fillClass + '" style="width:' + (cap.ratio * 100) + '%"></div></div>' +
            '<span class="capacity-label mono">' + cap.taken + " / " + a.capacity + '</span>' +
          '</div>' +
        "</td>" +
        "<td>" + statusPill + "</td>" +
      "</tr>";
    }).join("");
  }

  function updateTabBar() {
    var dashboardBtn = document.getElementById("tabDashboardBtn");
    var printBtn = document.getElementById("tabPrintBtn");
    var peopleBtn = document.getElementById("tabPeopleBtn");
    var otherBtn = document.getElementById("tabOtherBtn");
    var settingsBtn = document.getElementById("tabSettingsBtn");
    var scanBtn = document.getElementById("tabScanBtn");
    var lock = document.getElementById("tabPrintLock");
    if (dashboardBtn) dashboardBtn.classList.toggle("active", view.activeTab === "dashboard");
    if (printBtn) printBtn.classList.toggle("active", view.activeTab === "print");
    if (peopleBtn) peopleBtn.classList.toggle("active", view.activeTab === "people");
    if (otherBtn) otherBtn.classList.toggle("active", view.activeTab === "other");
    if (settingsBtn) settingsBtn.classList.toggle("active", view.activeTab === "settings");
    if (scanBtn) scanBtn.classList.toggle("is-active", view.screen === "camera");
    if (lock) lock.style.display = view.staffUnlocked ? "none" : "";
  }

  function renderModal() {
    var shell = document.querySelector(".app-shell");
    var old = document.getElementById("confirmModal");
    if (old) old.remove();
    var nmod = view.nameModal;
    if (nmod && shell) {
      var nmEl = document.createElement("div");
      nmEl.id = "confirmModal";
      nmEl.className = "modal-backdrop";
      nmEl.innerHTML =
        '<div class="modal problem-modal" role="dialog" aria-modal="true" aria-label="Your name">' +
          '<h3 class="modal-title">' + (nmod.first ? 'Welcome! Who are you?' : 'Change your name or role') + '</h3>' +
          '<div class="modal-sub" style="font-size:13px;text-align:center">' +
            (nmod.first ? 'You’re connected to the Sheet. Your name and role go on the staff access list so the team knows who’s using this phone.'
                        : 'This updates your name and role on the staff access list.') +
          '</div>' +
          '<input class="text-input" id="staffNameInput" type="text" maxlength="60" autocomplete="name" autocapitalize="words" placeholder="Your full name" value="' + esc(nmod.name) + '">' +
          '<select class="text-input staff-role-select" id="staffRoleSelect" aria-label="Your role">' +
            '<option value=""' + (nmod.role ? '' : ' selected') + ' disabled>Who are you?</option>' +
            STAFF_ROLES.map(function (r) { return '<option value="' + r + '"' + (nmod.role === r ? ' selected' : '') + '>' + r + '</option>'; }).join("") +
          '</select>' +
          (nmod.error ? '<div class="field-error">' + esc(nmod.error) + '</div>' : '') +
          (nmod.first
            ? '<button class="btn btn-yes btn-block btn-lg" data-action="saveStaffName" type="button">Continue</button>'
            : '<div class="modal-actions">' +
                '<button class="btn" data-action="cancelNameModal" type="button">Cancel</button>' +
                '<button class="btn btn-yes" data-action="saveStaffName" type="button">Save</button>' +
              '</div>') +
        '</div>';
      shell.appendChild(nmEl);
      var nIn = document.getElementById("staffNameInput");
      if (nIn) {
        nIn.addEventListener("input", function () { nmod.name = nIn.value; });
        nIn.addEventListener("keydown", function (e) { if (e.key === "Enter") saveStaffName(); });
      }
      var rSel = document.getElementById("staffRoleSelect");
      if (rSel) rSel.addEventListener("change", function () { nmod.role = rSel.value; });
      return;
    }
    var pm = view.problemModal;
    if (pm && shell) {
      var pmEl = document.createElement("div");
      pmEl.id = "confirmModal";
      pmEl.className = "modal-backdrop";
      pmEl.innerHTML = pm.sent
        ? '<div class="modal" role="dialog" aria-modal="true" aria-label="Problem submitted">' +
            '<h3 class="modal-title">&#10003; Problem submitted</h3>' +
            '<div class="modal-sub" style="font-size:13px">' + esc(pm.note || "") + '</div>' +
            '<button class="btn btn-primary btn-block" data-action="closeProblemModal" type="button">Done</button>' +
          '</div>'
        : '<div class="modal problem-modal" role="dialog" aria-modal="true" aria-label="Submit a problem">' +
            '<h3 class="modal-title">Submit a problem</h3>' +
            '<textarea class="text-input problem-textarea" id="problemText" rows="5" maxlength="2000" placeholder="What happened? e.g. scanner won’t read Team Blue lanyards">' + esc(pm.text) + '</textarea>' +
            '<input class="text-input" id="problemName" type="text" maxlength="60" autocomplete="name" placeholder="Your name (optional)" value="' + esc(pm.name) + '">' +
            (pm.error ? '<div class="field-error">' + esc(pm.error) + '</div>' : '') +
            '<div class="modal-actions">' +
              '<button class="btn" data-action="closeProblemModal" type="button">Cancel</button>' +
              '<button class="btn btn-yes" data-action="submitProblem" type="button"' + (pm.sending ? ' disabled' : '') + '>' + (pm.sending ? 'Sending…' : 'Submit') + '</button>' +
            '</div>' +
          '</div>';
      shell.appendChild(pmEl);
      var pText = document.getElementById("problemText");
      var pName = document.getElementById("problemName");
      if (pText) pText.addEventListener("input", function () { pm.text = pText.value; });
      if (pName) pName.addEventListener("input", function () { pm.name = pName.value; });
      return;
    }
    var c = view.confirm;
    if (!c || !shell) return;
    var m = document.createElement("div");
    m.id = "confirmModal";
    m.className = "modal-backdrop";
    if (c.kind === "deletePreset") {
      var pr = findPreset(scopeOf(c.scope).id);
      m.innerHTML =
        '<div class="modal" role="dialog" aria-modal="true" aria-label="Delete layout">' +
          '<h3 class="modal-title">Delete this layout?</h3>' +
          '<div class="modal-name">' + esc(pr ? pr.name : "") + '</div>' +
          '<div class="modal-actions">' +
            '<button class="btn" data-action="confirmNo" type="button">No</button>' +
            '<button class="btn btn-yes" data-action="confirmYes" type="button">Yes</button>' +
          '</div>' +
        '</div>';
      shell.appendChild(m);
      return;
    }
    if (c.kind === "resetPrinted") {
      var printedNow = state.registrants.filter(function (x) { return x.qrPrinted && !x.walkin; }).length;
      m.innerHTML =
        '<div class="modal" role="dialog" aria-modal="true" aria-label="Reset printing">' +
          '<h3 class="modal-title">Are you sure?</h3>' +
          '<div class="modal-sub" style="font-size:14px;color:var(--ink)">This marks all ' + printedNow + ' printed lanyard' + (printedNow === 1 ? '' : 's') + ' as <strong>not printed</strong>' + (BACKEND_URL ? ', in the Sheet too' : '') + '. It can\u2019t be undone.</div>' +
          '<div class="modal-sub">Walk-ins keep their blank cards and aren\u2019t changed.</div>' +
          '<div class="modal-actions">' +
            '<button class="btn" data-action="confirmNo" type="button">No</button>' +
            '<button class="btn btn-danger" data-action="confirmYes" type="button">Yes, reset</button>' +
          '</div>' +
        '</div>';
      shell.appendChild(m);
      return;
    }
    var r = byId(state.registrants, c.id);
    if (!r) return;
    if (c.kind === "task") {
      var tk = findTask(c.task);
      var sub = tk && tk.key === "shirt" && shirtText(r) ? esc(shirtText(r)) + ' &middot; ' : '';
      m.innerHTML =
        '<div class="modal" role="dialog" aria-modal="true" aria-label="Confirm ' + esc(tk ? tk.label : "") + '">' +
          '<h3 class="modal-title">' + (c.next ? esc(tk.label) : 'Undo ' + esc(tk.label.toLowerCase()) + '?') + '</h3>' +
          '<div class="modal-person">' + avatarHtml(r) +
            '<div class="modal-name">' + esc(r.name) + '</div>' +
            '<div class="modal-sub">' + sub + esc(r.team || r.ward) + '</div>' +
          '</div>' +
          '<div class="modal-sub" style="font-size:14px;color:var(--ink)">' +
            (c.next ? (tk.key === "shirt" ? 'Have they collected their shirt?' : 'Have they been given their check-in pack?') : 'Mark this as not done yet?') +
          '</div>' +
          '<div class="modal-actions">' +
            '<button class="btn" data-action="confirmNo" type="button">No</button>' +
            '<button class="btn btn-yes" data-action="confirmYes" type="button">Yes</button>' +
          '</div>' +
        '</div>';
      shell.appendChild(m);
      return;
    }
    m.innerHTML =
      '<div class="modal" role="dialog" aria-modal="true" aria-label="Confirm pickup">' +
        '<h3 class="modal-title">' + (c.next ? 'Confirm airport pickup' : 'Undo pickup?') + '</h3>' +
        '<div class="modal-person">' + avatarHtml(r) +
          '<div class="modal-name">' + esc(r.name) + '</div>' +
          '<div class="modal-sub">' + esc(r.pickupTime || "") + ' &middot; ' + esc(r.ward) + '</div>' +
        '</div>' +
        '<div class="modal-sub" style="font-size:14px;color:var(--ink)">' + (c.next ? 'Have they been picked up?' : 'Mark them as not picked up yet?') + '</div>' +
        '<div class="modal-actions">' +
          '<button class="btn" data-action="confirmNo" type="button">No</button>' +
          '<button class="btn btn-yes" data-action="confirmYes" type="button">Yes</button>' +
        '</div>' +
      '</div>';
    shell.appendChild(m);
  }

  function render() {
    renderScreen();
    updateTabBar();
    renderModal();
  }

  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-action]");
    if (t) {
      var action = t.getAttribute("data-action");
      if (action === "scan") scan(t.getAttribute("data-id"));
      else if (action === "selectTab") selectTab(t.getAttribute("data-tab"));
      else if (action === "openCamera") openCamera();
      else if (action === "cancelCamera") cancelCamera();
      else if (action === "manualGo") submitManualId(document.getElementById("manualId").value);
      else if (action === "checkin") checkIn(t.getAttribute("data-id"));
      else if (action === "toggleLost") toggleLost(t.getAttribute("data-id"));
      else if (action === "book") book(t.getAttribute("data-id"), t.getAttribute("data-activity"));
      else if (action === "backFromScanned") backFromScanned();
      else if (action === "personTab") setPersonTab(t.getAttribute("data-tab"));
      else if (action === "askPickup") askPickup(t.getAttribute("data-id"));
      else if (action === "askTask") askTask(t.getAttribute("data-id"), t.getAttribute("data-task"));
      else if (action === "confirmYes") answerPickup(true);
      else if (action === "confirmNo") answerPickup(false);
      else if (action === "presetToggleEdit") { var pse = scopeOf(pscopeOf(t)); pse.edit = !pse.edit; render(); }
      else if (action === "presetSaveNew") savePresetNew(pscopeOf(t));
      else if (action === "presetSaveOver") savePresetOver(pscopeOf(t));
      else if (action === "presetReset") selectPreset(pscopeOf(t), scopeOf(pscopeOf(t)).id);
      else if (action === "presetDelete") { view.confirm = { kind: "deletePreset", scope: pscopeOf(t) }; render(); }
      else if (action === "otherPage") setOtherPage(t.getAttribute("data-page"));
      else if (action === "otherBack") otherBack();
      else if (action === "pinBack") pinBack();
      else if (action === "submitPin") submitPin(document.getElementById("pinInput").value);
      else if (action === "selectAllUnprinted") selectAllUnprinted();
      else if (action === "clearSelection") clearSelection();
      else if (action === "generatePrint") generateAndPrint();
      else if (action === "askResetPrinted") { view.confirm = { kind: "resetPrinted" }; render(); }
      else if (action === "printBlankCards") printBlankCards();
      else if (action === "walkinsTab") { view.walkinsTab = t.getAttribute("data-tab"); view.walkinToast = ""; render(); }
      else if (action === "openSetupCamera") openCamera("setup");
      else if (action === "saveStaffName") saveStaffName();
      else if (action === "changeStaffName") { view.nameModal = { name: staffName, role: staffRole, error: "", first: !staffName || !staffRole }; render(); focusNameInput(); }
      else if (action === "cancelNameModal") { view.nameModal = null; render(); }
      else if (action === "refreshStaff") { staffStatus = "Loading…"; render(); loadStaff(); }
      else if (action === "openProblemModal") openProblemModal();
      else if (action === "closeProblemModal") closeProblemModal();
      else if (action === "submitProblem") submitProblem();
      else if (action === "openProblems") openProblems();
      else if (action === "problemsBack") { view.screen = "tab"; view.activeTab = "settings"; render(); }
      else if (action === "problemStatus") setProblemStatus(t.getAttribute("data-id"), t.getAttribute("data-resolved") === "1");
      else if (action === "shareStep") { view.shareStep = parseInt(t.getAttribute("data-step"), 10) || 0; render(); }
      else if (action === "saveWalkin") saveWalkin();
      else if (action === "cancelWalkin") cancelWalkin();
      return;
    }
    if (e.target && e.target.id === "resetBtn") resetDemo();
    if (e.target && e.target.id === "connectBtn") connectBackend();
  });

  document.addEventListener("change", function (e) {
    var tgt = e.target;
    if (tgt && tgt.getAttribute && tgt.getAttribute("data-preset-select")) { selectPreset(pscopeOf(tgt), tgt.value); return; }
    if (tgt && tgt.getAttribute && tgt.getAttribute("data-pfield")) {
      setPresetField(pscopeOf(tgt), tgt.getAttribute("data-pfield"), tgt.type === "checkbox" ? tgt.checked : tgt.value);
      return;
    }
    if (e.target && e.target.getAttribute && e.target.getAttribute("data-action") === "toggleSelect") {
      toggleSelect(e.target.getAttribute("data-id"));
    }
  });

  document.addEventListener("keydown", function (e) {
    if (e.target && e.target.id === "settingsUrlInput" && e.key === "Enter") connectBackend();
  });

  // ---------- init ----------
  render();
  if (BACKEND_URL) loadFromBackend();
})();
</script>

</body>
</html>
