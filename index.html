<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QR Check-In</title>
<style>html,body{margin:0;padding:0}</style>
</head>
<body>
<style>
  :root {
    --ground: #f5f2ea;
    --surface: #fffefb;
    --surface-2: #ece7da;
    --ink: #20262b;
    --ink-soft: #55524a;
    --muted: #85806f;
    --line: #ddd5c2;
    --accent: #2b6e7a;
    --accent-ink: #0f3d45;
    --accent-tint: #dfeced;
    --success: #3f7d45;
    --success-tint: #e2eee0;
    --warning: #a8721f;
    --warning-tint: #f4e6cf;
    --critical: #a23b2e;
    --critical-tint: #f4dfd9;
    --focus: #2b6e7a;
    --shadow: 0 1px 2px rgba(32,38,43,0.06), 0 8px 24px -12px rgba(32,38,43,0.18);
    --radius-s: 6px;
    --radius-m: 10px;
    --radius-l: 16px;
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #14181a;
      --surface: #1c2225;
      --surface-2: #232a2d;
      --ink: #ece9e1;
      --ink-soft: #c4c0b5;
      --muted: #8b9291;
      --line: #333c3f;
      --accent: #5db2c1;
      --accent-ink: #d7eef1;
      --accent-tint: #1d383d;
      --success: #6fbb78;
      --success-tint: #1f3122;
      --warning: #e0ac52;
      --warning-tint: #3a2c15;
      --critical: #e08574;
      --critical-tint: #3c211d;
      --focus: #5db2c1;
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 28px -14px rgba(0,0,0,0.6);
      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --ground: #14181a;
    --surface: #1c2225;
    --surface-2: #232a2d;
    --ink: #ece9e1;
    --ink-soft: #c4c0b5;
    --muted: #8b9291;
    --line: #333c3f;
    --accent: #5db2c1;
    --accent-ink: #d7eef1;
    --accent-tint: #1d383d;
    --success: #6fbb78;
    --success-tint: #1f3122;
    --warning: #e0ac52;
    --warning-tint: #3a2c15;
    --critical: #e08574;
    --critical-tint: #3c211d;
    --focus: #5db2c1;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 28px -14px rgba(0,0,0,0.6);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  body {
    background: var(--ground);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    line-height: 1.45;
  }

  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }

  .page {
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 24px 48px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .topbar {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--line);
    padding-bottom: 18px;
  }

  .eyebrow {
    display: block;
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 6px;
  }

  h1 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: clamp(24px, 3vw, 32px);
    margin: 0;
    text-wrap: balance;
    letter-spacing: -0.01em;
  }

  .topbar-actions {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  .note-chip {
    font-size: 12.5px;
    color: var(--ink-soft);
    background: var(--surface-2);
    border: 1px solid var(--line);
    padding: 6px 12px;
    border-radius: 999px;
  }

  .btn {
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 500;
    padding: 8px 16px;
    border-radius: var(--radius-s);
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent-ink); }
  .btn:focus-visible, a:focus-visible, [tabindex]:focus-visible, button:focus-visible, input:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }
  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--surface);
  }
  .btn-primary:hover { filter: brightness(1.06); color: var(--surface); }
  .btn-primary:disabled, .btn[disabled] {
    opacity: 0.55;
    cursor: not-allowed;
    filter: none;
  }
  .btn-block { width: 100%; }
  .btn-ghost { background: transparent; }
  .btn-lg { padding: 12px 16px; font-size: 14.5px; }
  .btn-sm { padding: 5px 10px; font-size: 11.5px; }
  .btn-danger { background: var(--critical-tint); border-color: var(--critical); color: var(--critical); }
  .btn-danger:hover { background: var(--critical); border-color: var(--critical); color: #fff; }

  /* ---------- App shell (same layout on phone and desktop) ---------- */
  .app-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; }

  .app-shell {
    width: 100%;
    max-width: 460px;
    margin: 0 auto;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-l);
    box-shadow: var(--shadow);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    height: min(80vh, 690px);
    position: relative;
  }

  .loading-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    overflow: hidden;
    z-index: 4;
    background: transparent;
  }
  .loading-bar.is-active::after {
    content: "";
    position: absolute;
    top: 0; left: -30%;
    width: 30%; height: 100%;
    background: var(--accent);
    animation: loadingSlide 0.9s linear infinite;
  }
  @keyframes loadingSlide {
    0% { left: -30%; }
    100% { left: 100%; }
  }

  .conn-dot-wrap {
    position: absolute;
    top: 10px;
    right: 12px;
    z-index: 4;
  }
  .conn-dot {
    display: block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--muted);
    box-shadow: 0 0 0 3px var(--surface);
  }
  .conn-dot.is-on { background: var(--success); }

  .phone-content {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 20px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scrollbar-width: thin;
  }
  .phone-tabbar {
    flex: none;
    display: flex;
    align-items: flex-end;
    justify-content: space-around;
    gap: 2px;
    padding: 6px 6px 12px;
    border-top: 1px solid var(--line);
    background: var(--surface);
  }
  .tabbar-btn {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    background: none;
    border: none;
    font-family: inherit;
    font-size: 8.5px;
    font-weight: 500;
    color: var(--muted);
    padding: 4px 1px;
    cursor: pointer;
    position: relative;
    text-align: center;
    line-height: 1.05;
  }
  .tabbar-btn svg { width: 17px; height: 17px; }
  .tabbar-btn.active { color: var(--accent-ink); }
  .tabbar-lock {
    position: absolute;
    top: -3px;
    right: 22%;
    font-size: 9px;
    line-height: 1;
  }
  .tabbar-scan {
    flex: none;
    width: 54px;
    height: 54px;
    margin-top: -26px;
    border-radius: 50%;
    border: 4px solid var(--surface);
    background: var(--accent);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: var(--shadow);
  }
  .tabbar-scan svg { width: 22px; height: 22px; }
  .tabbar-scan:hover { filter: brightness(1.07); }
  .tabbar-scan.is-active { box-shadow: 0 0 0 4px var(--accent-tint), var(--shadow); }

  /* ---------- Confirm prompt (guards against miss-taps) ---------- */
  .modal-backdrop {
    position: absolute; inset: 0; z-index: 10;
    background: rgba(20, 24, 26, 0.55);
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .modal {
    width: 100%; max-width: 340px; background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius-l); box-shadow: var(--shadow); padding: 20px 18px 16px;
    display: flex; flex-direction: column; gap: 14px; text-align: center;
  }
  .modal-title { font-family: "Fraunces", Georgia, serif; font-size: 18px; font-weight: 600; margin: 0; }
  .modal-person { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .modal-person .avatar { width: 64px; height: 64px; font-size: 22px; }
  .modal-name { font-size: 16px; font-weight: 600; }
  .modal-sub { font-size: 12.5px; color: var(--muted); }
  .modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .modal-actions .btn { padding: 13px 10px; font-size: 15px; font-weight: 600; }
  .btn-yes { background: var(--success); border-color: var(--success); color: #fff; }
  .btn-yes:hover { filter: brightness(1.08); color: #fff; border-color: var(--success); }

  .phone-caption {
    display: none;
  }

  .screen-title {
    font-family: "Fraunces", Georgia, serif;
    font-size: 18px;
    font-weight: 600;
    margin: 0;
  }
  .screen-sub { font-size: 12.5px; color: var(--muted); margin: -8px 0 2px; }

  .divider-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 2px 0;
  }
  .divider-row::before, .divider-row::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }
  .divider-row span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }

  .lanyard-list { display: flex; flex-direction: column; gap: 8px; }
  .lanyard-item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    text-align: left;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: var(--radius-m);
    padding: 10px 12px;
    cursor: pointer;
    font-family: inherit;
    color: var(--ink);
  }
  .lanyard-item:hover { border-color: var(--accent); }
  .qr-glyph {
    width: 30px; height: 30px; flex: none;
    border-radius: 5px;
    background:
      repeating-linear-gradient(90deg, var(--ink) 0 3px, transparent 3px 6px),
      repeating-linear-gradient(0deg, var(--ink) 0 3px, transparent 3px 6px);
    background-blend-mode: multiply;
    background-color: var(--surface);
    opacity: 0.85;
  }
  .lanyard-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1; }
  .lanyard-name { font-size: 13.5px; font-weight: 500; }
  .lanyard-id { font-size: 11px; color: var(--muted); }

  .lookup-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
    width: 100%;
    text-align: left;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: var(--radius-m);
    padding: 10px 12px;
    cursor: pointer;
    font-family: inherit;
    color: var(--ink);
  }
  .lookup-item:hover { border-color: var(--accent); }
  .lookup-name { font-size: 13.5px; font-weight: 500; }
  .lookup-meta { font-size: 11px; color: var(--muted); }

  .avatar {
    position: relative; flex: none; width: 36px; height: 36px; border-radius: 50%;
    overflow: hidden; background: var(--accent-tint, var(--surface)); color: var(--accent, var(--ink-soft));
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600; letter-spacing: .02em; border: 1px solid var(--line);
  }
  .avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .lookup-item.has-avatar { flex-direction: row; align-items: center; gap: 10px; }
  .lookup-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
  .lost-row-info.has-avatar { flex-direction: row; align-items: center; gap: 10px; }
  .id-row-main { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
  .id-row { flex-wrap: wrap; }
  .avatar-lg { width: 56px; height: 56px; font-size: 20px; }

  .card {
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: var(--radius-m);
    padding: 14px;
  }
  .id-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .id-name { font-family: "Fraunces", Georgia, serif; font-size: 19px; font-weight: 600; }
  .id-meta { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
  .id-code { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .id-print-note { font-size: 11px; color: var(--muted); margin-top: 3px; }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    font-weight: 500;
    padding: 3px 9px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .pill-success { background: var(--success-tint); color: var(--success); }
  .pill-warning { background: var(--warning-tint); color: var(--warning); }
  .pill-critical { background: var(--critical-tint); color: var(--critical); }
  .pill-neutral { background: var(--surface); color: var(--ink-soft); border: 1px solid var(--line); }
  .pill-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill-sm { font-size: 10.5px; padding: 2px 7px; }

  .flag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }

  .alert-lost {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--critical-tint);
    color: var(--critical);
    border-radius: var(--radius-m);
    padding: 10px 12px;
    font-size: 12.5px;
    font-weight: 500;
  }

  .lost-panel {
    border-radius: var(--radius-m);
    border: 1px solid var(--line);
    background: var(--surface-2);
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .lost-panel.is-alert { border-color: var(--critical); background: var(--critical-tint); }
  .lost-panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-soft);
  }
  .lost-panel.is-alert .lost-panel-head { color: var(--critical); }
  .lost-row {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-s);
    padding: 8px 10px;
  }
  .lost-row-info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 1px;
    text-align: left;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    font-family: inherit;
    color: var(--ink);
  }

  /* ---------- Airport pickup ---------- */
  .slot-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    margin-top: 8px; padding: 8px 12px;
    background: var(--accent-tint); border: 1px solid var(--line); border-radius: var(--radius-m);
  }
  .slot-time { font-family: "Fraunces", Georgia, serif; font-size: 16px; font-weight: 600; color: var(--accent-ink); }
  .slot-count { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.15; }
  .slot-count-num { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; font-size: 20px; font-weight: 600; color: var(--ink); }
  .slot-count-label { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .slot-head.is-complete { background: var(--success-tint); }
  .slot-head.is-complete .slot-time, .slot-head.is-complete .slot-count-num { color: var(--success); }
  .pickup-summary { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--muted); margin: -4px 0 0; }
  .pickup-row { display: flex; align-items: stretch; gap: 8px; }
  .pickup-row .lookup-item { flex: 1; min-width: 0; }
  .pickup-row.is-done .lookup-item { opacity: 0.62; }
  .pickup-check {
    flex: none; width: 48px; border-radius: var(--radius-m);
    border: 2px solid var(--line); background: var(--surface); color: transparent;
    display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 22px; font-weight: 700;
    font-family: inherit; padding: 0;
  }
  .pickup-check:hover { border-color: var(--accent); }
  .pickup-check.is-checked { background: var(--success); border-color: var(--success); color: #fff; }
  /* ---------- Check-in checklist ---------- */
  .task-list { display: flex; flex-direction: column; gap: 8px; }
  .task-head { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; display: flex; justify-content: space-between; }
  .task-row {
    display: flex; align-items: stretch; gap: 8px;
    background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-m);
  }
  .task-text { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 2px; padding: 10px 12px; }
  .task-name { font-size: 14px; font-weight: 500; }
  .task-meta { font-size: 11.5px; color: var(--muted); }
  .task-row.is-done .task-name { color: var(--muted); text-decoration: line-through; }
  .task-row .pickup-check { margin: 6px 6px 6px 0; min-height: 44px; }
  /* ---------- Print layout presets ---------- */
  .preset-card { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-m); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .preset-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
  .preset-select { flex: none; width: 100%; font-family: inherit; font-size: 13.5px; }
  .preset-summary { font-size: 12px; color: var(--ink-soft); }
  .preset-summary .is-mod { color: var(--warning); font-weight: 600; }
  .preset-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; }
  .preset-field { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--muted); }
  .preset-field input[type="number"] { flex: none; width: 100%; font-family: "IBM Plex Mono", monospace; font-size: 13px; padding: 6px 8px; border-radius: var(--radius-s); border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
  .preset-toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; }
  .preset-toggle { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink); }
  .preset-toggle input { width: 16px; height: 16px; accent-color: var(--accent); }
  .preset-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .preset-actions .text-input { flex: 1 1 140px; min-width: 0; }
  .preset-edit { display: flex; flex-direction: column; gap: 10px; border-top: 1px dashed var(--line); padding-top: 10px; }
  /* ---------- Person details tab ---------- */
  .phone-content > * { flex-shrink: 0; }
  .details-card { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-m); overflow: hidden; }
  .detail-row { display: flex; flex-direction: column; gap: 1px; padding: 9px 12px; border-bottom: 1px solid var(--line); }
  .detail-row:last-child { border-bottom: none; }
  .detail-label { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .detail-value { font-size: 13.5px; color: var(--ink); overflow-wrap: anywhere; white-space: pre-wrap; }
  .detail-value.is-empty { color: var(--muted); }
  .detail-value a { color: var(--accent); }
  .list-total { font-size: 12px; color: var(--muted); margin: -4px 0 2px; }
  .list-group-head {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    font-weight: 600;
    margin-top: 6px;
  }

  .diet-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    margin-top: 8px; padding: 8px 12px;
    background: var(--warning-tint); border: 1px solid var(--line); border-radius: var(--radius-m);
    font-family: "Fraunces", Georgia, serif; font-size: 16px; font-weight: 600; color: var(--warning);
  }
  .diet-head-count { font-size: 15px; color: var(--ink); }
  .diet-head-other { background: var(--critical-tint); color: var(--critical); }
  .diet-other-item {
    display: flex; flex-direction: column; gap: 4px; width: 100%; text-align: left;
    background: var(--surface-2); border: 1px solid var(--line); border-left: 4px solid var(--critical);
    border-radius: var(--radius-m); padding: 10px 12px; cursor: pointer; font-family: inherit; color: var(--ink);
  }
  .diet-other-item:hover { border-color: var(--critical); }
  .diet-other-name { font-size: 13px; font-weight: 500; color: var(--ink-soft); }

<div class="print-sheet" id="printSheet" aria-hidden="true"></div>

<script>
(function () {
  "use strict";

  var DEMO_PIN = "2468";
  // Where the app lives for staff phones (GitHub Pages). Shown as step 1 of "Share QR code" in Settings.
  var APP_SITE_URL = "https://noahruediger.github.io/ysa-qr-checkin/";

  // ---------- live backend wiring ----------
  var BACKEND_URL = "";
  try { BACKEND_URL = localStorage.getItem("qrCheckinBackendUrl") || ""; } catch (e) { /* private window etc — fine, just no persistence */ }
  var backendBusy = false;
  var settingsUrlDraft = BACKEND_URL;
  var lastStatusText = "Not connected";
  var connectedOk = false;
  var pendingRequests = 0;

  function setConnStatus(text, ok) {
    lastStatusText = text;
    connectedOk = !!ok;
    var dot = document.getElementById("connDot");
    if (dot) dot.classList.toggle("is-on", connectedOk);
    var statusText = document.getElementById("settingsStatusText");
    if (statusText) {
      statusText.textContent = text;
      statusText.style.color = ok ? "var(--success)" : "";
    }
  }

  function setLoading(isLoading) {
    pendingRequests += isLoading ? 1 : -1;
    if (pendingRequests < 0) pendingRequests = 0;
    var bar = document.getElementById("loadingBar");
    if (bar) bar.classList.toggle("is-active", pendingRequests > 0);
  }

  function apiGet(action) {
    var url = BACKEND_URL + (BACKEND_URL.indexOf("?") === -1 ? "?" : "&") + "action=" + encodeURIComponent(action);
    setLoading(true);
    return fetch(url).then(function (r) { return r.json(); }).finally(function () { setLoading(false); });
  }

  // NOTE: no custom headers here on purpose — a bare string body defaults to
  // Content-Type: text/plain, which keeps this a CORS "simple request" so it
  // works straight from a locally-hosted page with no server-side CORS setup
  // (Apps Script web apps can't answer a CORS preflight OPTIONS request).
  function apiPost(payload) {
    setLoading(true);
    return fetch(BACKEND_URL, { method: "POST", body: JSON.stringify(payload) }).then(function (r) { return r.json(); }).finally(function () { setLoading(false); });
  }

  // Pickup ticks are also remembered on this phone, so they survive a reload even if the
  // backend hasn't been given the pickup column yet.
  var localPicked = {};
  try { localPicked = JSON.parse(localStorage.getItem("qrCheckinPickedUp") || "{}") || {}; } catch (e) { localPicked = {}; }
  function saveLocalPicked() { try { localStorage.setItem("qrCheckinPickedUp", JSON.stringify(localPicked)); } catch (e) { /* fine */ } }

  // Check-in checklist. Each task is a Yes/No column pair in the Sheet (e.g. "Pack Given" / "Pack Given At").
  // Ticks are also remembered on this phone, like pickup ticks.
  var CHECKIN_TASKS = [
    { key: "pack", label: "Check-in pack", field: "packGiven", atField: "packGivenAt" },
    { key: "shirt", label: "Shirt collection", field: "shirtGiven", atField: "shirtGivenAt" }
  ];
  var localTasks = {};
  try { localTasks = JSON.parse(localStorage.getItem("qrCheckinTasks") || "{}") || {}; } catch (e) { localTasks = {}; }
  function saveLocalTasks() { try { localStorage.setItem("qrCheckinTasks", JSON.stringify(localTasks)); } catch (e) { /* fine */ } }
  // ---------- walk-ins (people who sign up on the day with a pre-printed blank card) ----------
  // Blank cards carry codes YSA-A0001, YSA-A0002 ... Scanning one that isn't linked to anyone yet
  // opens the walk-in sign-up screen. Walk-ins are also kept on this phone so nothing is lost if
  // the Sheet can't be reached; they're re-sent next time the app connects.
  var WALKIN_RE = /^YSA-A\d{4}$/;
  function isWalkinCode(id) { return WALKIN_RE.test(String(id || "").trim().toUpperCase()); }
  function walkinCode(n) { return "YSA-A" + ("000" + n).slice(-4); }
  function walkinNum(id) { var m = /^YSA-A(\d{4})$/.exec(String(id || "")); return m ? parseInt(m[1], 10) : 0; }

  var localWalkins = {};   // id -> { id, name, ward, photo, at, synced }
  try { localWalkins = JSON.parse(localStorage.getItem("qrCheckinWalkins") || "{}") || {}; } catch (e) { localWalkins = {}; }
  function saveLocalWalkins() {
    try { localStorage.setItem("qrCheckinWalkins", JSON.stringify(localWalkins)); }
    catch (e) {
      // Out of space (photos are the heavy part) — keep the names and drop photos that already reached the Sheet.
      try {
        Object.keys(localWalkins).forEach(function (k) { if (localWalkins[k].synced) localWalkins[k].photo = null; });
        localStorage.setItem("qrCheckinWalkins", JSON.stringify(localWalkins));
      } catch (e2) { /* fine — the in-memory copy still works this session */ }
    }
  }
  var walkinPrintedTo = 0;  // highest blank card number printed on this phone
  try { walkinPrintedTo = parseInt(localStorage.getItem("qrCheckinWalkinPrintedTo") || "0", 10) || 0; } catch (e) { walkinPrintedTo = 0; }

  function walkinToRegistrant(w) {
    return {
      id: w.id, name: w.name, ward: w.ward || "Walk-in", stake: w.stake || "", dietary: null,
      checkedIn: false, checkedInAt: null, bookings: [],
      qrPrinted: true, qrPrintedAt: "Blank card",
      lost: false, lostAt: null, needsPickup: false, pickupTime: null,
      details: [["QR ID", w.id], ["Name", w.name], ["Ward", w.ward || ""], ["Walk-in", "Yes"], ["Registered At", w.at || ""]],
      pickedUp: false, pickedUpAt: null, team: null, photo: w.photo || null,
      shirtSize: null, shirtColour: null,
      packGiven: !!(localTasks[w.id] && localTasks[w.id].pack), packGivenAt: (localTasks[w.id] && localTasks[w.id].pack) || null,
      shirtGiven: !!(localTasks[w.id] && localTasks[w.id].shirt), shirtGivenAt: (localTasks[w.id] && localTasks[w.id].shirt) || null,
      walkin: true
    };
  }

  // Add any walk-ins saved on this phone that the current list doesn't have yet.
  function mergeLocalWalkins() {
    Object.keys(localWalkins).forEach(function (id) {
      var existing = byId(state.registrants, id);
      if (!existing) state.registrants.push(walkinToRegistrant(localWalkins[id]));
      else {
        existing.walkin = true;
        if (!existing.photo && localWalkins[id].photo) existing.photo = localWalkins[id].photo;
      }
    });
  }

  // Re-send walk-ins the Sheet hasn't confirmed yet (e.g. registered while the wifi was down).
  function syncPendingWalkins() {
    if (!BACKEND_URL) return;
    Object.keys(localWalkins).forEach(function (id) {
      var w = localWalkins[id];
      if (w.synced) return;
      var onServer = byId(state.registrants, id);
      if (onServer && onServer.fromServer) { w.synced = true; saveLocalWalkins(); return; }
      apiPost({ action: "registerWalkin", id: w.id, name: w.name, ward: w.ward || "", photo: w.photo || "", at: w.at })
        .then(function (res) {
          if (res && res.ok) { w.synced = true; saveLocalWalkins(); }
        }).catch(function () { /* try again next load */ });
    });
  }

  function findTask(key) { for (var i = 0; i < CHECKIN_TASKS.length; i++) { if (CHECKIN_TASKS[i].key === key) return CHECKIN_TASKS[i]; } return null; }
  function detailOf(r, labelRe) {
    if (!r.details) return "";
    for (var i = 0; i < r.details.length; i++) { if (labelRe.test(r.details[i][0])) return r.details[i][1] || ""; }
    return "";
  }
  function shirtText(r) {
    var size = r.shirtSize || detailOf(r, /shirt.*size/i);
    var colour = r.shirtColour || detailOf(r, /shirt.*colou?r/i);
    var bits = [];
    if (size) bits.push("Size " + size);
    if (colour) bits.push(colour);
    return bits.join(" \u00b7 ");
  }

  // Every column of the Sheet row, in sheet order, as [label, value] pairs.
  // The backend can send an array of pairs / {label, value} objects, or a plain {header: value} object.
  function normalizeDetails(d) {
    if (!d) return null;
    if (Array.isArray(d)) {
      return d.map(function (x) {
        if (Array.isArray(x)) return [String(x[0]), x[1] == null ? "" : String(x[1])];
        return [String(x.label), x.value == null ? "" : String(x.value)];
      });
    }
    if (typeof d === "object") return Object.keys(d).map(function (k) { return [k, d[k] == null ? "" : String(d[k])]; });
    return null;
  }

  var detailsLoading = {};   // registrant id -> "loading" | error text
  function loadDetails(id) {
    var r = byId(state.registrants, id);
    if (!r || r.details || !BACKEND_URL || detailsLoading[id] === "loading") return;
    detailsLoading[id] = "loading";
    fetch(BACKEND_URL + (BACKEND_URL.indexOf("?") === -1 ? "?" : "&") + "action=person&id=" + encodeURIComponent(id))
      .then(function (x) { return x.json(); })
      .then(function (d) {
        if (d && d.ok && d.details) { r.details = normalizeDetails(d.details); delete detailsLoading[id]; }
        else detailsLoading[id] = "The Sheet script doesn't have the \u201cperson\u201d update yet (" + ((d && d.error) || "no details returned") + ")";
        render();
      }).catch(function (err) { detailsLoading[id] = "Couldn't load details \u2014 " + err; render(); });
  }

  function detailValueHtml(v) {
    if (!v) return '<span class="detail-value is-empty">\u2014</span>';
    var e = esc(v);
    if (/^https?:\/\/\S+$/i.test(v)) e = '<a href="' + e + '" target="_blank" rel="noopener noreferrer">' + e + '</a>';
    return '<span class="detail-value">' + e + '</span>';
  }

  function mapServerRegistrant(r) {
    return {
      id: r.id, name: r.name, ward: r.ward, stake: r.stake, dietary: r.dietary,
      checkedIn: !!r.checkedIn, checkedInAt: r.checkedInAt || null,
      bookings: r.bookings || [],
      qrPrinted: !!r.qrPrinted, qrPrintedAt: r.qrPrintedAt || null,
      lost: !!r.lost, lostAt: r.lostAt || null,
      needsPickup: !!r.needsPickup, pickupTime: r.pickupTime || null,
      details: normalizeDetails(r.details),
      pickedUp: r.pickedUp === undefined ? !!localPicked[r.id] : !!r.pickedUp,
      pickedUpAt: r.pickedUpAt || (localPicked[r.id] && localPicked[r.id] !== true ? localPicked[r.id] : null),
      team: r.team || null,
      photo: r.photo || r.photoUrl || null,
      shirtSize: r.shirtSize || null,
      shirtColour: r.shirtColour || null,
      packGiven: r.packGiven === undefined ? !!(localTasks[r.id] && localTasks[r.id].pack) : !!r.packGiven,
      packGivenAt: r.packGivenAt || (localTasks[r.id] && localTasks[r.id].pack) || null,
      shirtGiven: r.shirtGiven === undefined ? !!(localTasks[r.id] && localTasks[r.id].shirt) : !!r.shirtGiven,
      shirtGivenAt: r.shirtGivenAt || (localTasks[r.id] && localTasks[r.id].shirt) || null,
      walkin: !!r.walkin || isWalkinCode(r.id),
      fromServer: true
    };
  }

  // ---------- staff names ("People with access") ----------
  // Each phone gets a random device ID. The first time it loads a Sheet, staff type their name;
  // the Sheet keeps a "Staff" tab of every phone that has connected (name, first connected, last seen).
  var deviceId = "";
  try { deviceId = localStorage.getItem("qrCheckinDeviceId") || ""; } catch (e) { deviceId = ""; }
  if (!deviceId) {
    deviceId = "D-" + Date.now().toString(36).toUpperCase() + "-" + Math.random().toString(36).slice(2, 7).toUpperCase();
    try { localStorage.setItem("qrCheckinDeviceId", deviceId); } catch (e) { /* fine */ }
  }
  var staffName = "";
  try { staffName = localStorage.getItem("qrCheckinStaffName") || ""; } catch (e) { staffName = ""; }
  var STAFF_ROLES = ["Admin", "Security", "Other"];
  var staffRole = "";
  try { staffRole = localStorage.getItem("qrCheckinStaffRole") || ""; } catch (e) { staffRole = ""; }
  var staffList = null;        // People with access, as last loaded from the Sheet
  var staffStatus = "";        // loading / error note for that list

  function roleClass(role) {
    return role === "Admin" ? "pill-success" : role === "Security" ? "pill-critical" : "pill-neutral";
  }

  function deviceLabel() {
    var ua = navigator.userAgent || "";
    var os = /iPhone/.test(ua) ? "iPhone" : /iPad/.test(ua) ? "iPad" : /Android/.test(ua) ? "Android" : /Mac OS X/.test(ua) ? "Mac" : /Windows/.test(ua) ? "Windows" : "Other";
    var br = /CriOS|Chrome\//.test(ua) && !/Edg\//.test(ua) ? "Chrome" : /Edg\//.test(ua) ? "Edge" : /FxiOS|Firefox\//.test(ua) ? "Firefox" : /Safari\//.test(ua) ? "Safari" : "Browser";
    return os + " · " + br;
  }

  function afterConnectStaff() {
    if (!staffName || !staffRole) { view.nameModal = { name: staffName, role: staffRole, error: "", saving: false, first: true }; render(); focusNameInput(); return; }
    registerStaff(false);   // already named: just refreshes "last seen"
  }

  function focusNameInput() { var n = document.getElementById("staffNameInput"); if (n) n.focus(); }

  function registerStaff(showErrors) {
    if (!BACKEND_URL || !staffName) return Promise.resolve();
    return apiPost({ action: "registerStaff", deviceId: deviceId, name: staffName, role: staffRole, device: deviceLabel() })
      .then(function (res) {
        if (res && res.ok) { if (res.staff) staffList = res.staff; staffStatus = ""; }
        else staffStatus = "The Sheet script needs the staff update to keep the access list (" + (res && res.error) + ").";
        if (view.screen === "tab" && view.activeTab === "settings") render();
      })
      .catch(function (err) { if (showErrors) { staffStatus = "Couldn’t reach the Sheet (" + err + ")."; render(); } });
  }

  function loadStaff() {
    if (!BACKEND_URL) { staffList = null; staffStatus = ""; return; }
    staffStatus = staffList ? "" : "Loading…";
    apiGet("staff").then(function (d) {
      if (d && d.ok) { staffList = d.staff || []; staffStatus = ""; }
      else staffStatus = "The Sheet script needs the staff update to keep the access list (" + (d && d.error) + ").";
      if (view.screen === "tab" && view.activeTab === "settings") render();
    }).catch(function (err) {
      staffStatus = "Couldn’t load the access list (" + err + ").";
      if (view.screen === "tab" && view.activeTab === "settings") render();
    });
  }

  function saveStaffName() {
    var nm = view.nameModal;
    if (!nm || nm.saving) return;
    var name = nm.name.replace(/\s+/g, " ").trim();
    if (name.length < 2) { nm.error = "Type your name so the team knows who’s using this phone."; render(); focusNameInput(); return; }
    if (STAFF_ROLES.indexOf(nm.role) === -1) { nm.error = "Choose who you are: Admin, Security or Other."; render(); return; }
    staffRole = nm.role;
    try { localStorage.setItem("qrCheckinStaffRole", staffRole); } catch (e) { /* fine */ }
    var oldName = staffName;
    staffName = name;
    try { localStorage.setItem("qrCheckinStaffName", name); } catch (e) { /* fine */ }
    if (!reporterName || reporterName === oldName) { reporterName = name; try { localStorage.setItem("qrCheckinReporterName", name); } catch (e) { /* fine */ } }
    view.nameModal = null;
    render();
    registerStaff(true);
  }

  function loadFromBackend() {
    if (!BACKEND_URL) return;
    setConnStatus("Loading from Sheet…", false);
    backendBusy = true;
    apiGet("list").then(function (data) {
      backendBusy = false;
      if (!data || data.ok === false) {
        setConnStatus("Couldn't load — " + (data && data.error ? data.error : "check the URL"), false);
        return;
      }
      state.registrants = data.registrants.map(mapServerRegistrant);
      state.activities = data.activities;
      mergeLocalWalkins();
      setConnStatus("Connected — live off the test Sheet (" + state.registrants.length + " registrants)", true);
      render();
      syncPendingWalkins();
      afterConnectStaff();
    }).catch(function (err) {
      backendBusy = false;
      setConnStatus("Couldn't reach that URL — " + err, false);
    });
  }

  function connectBackend() {
    var input = document.getElementById("settingsUrlInput");
    connectWithUrl((input && input.value || "").trim());
  }

  // Setup QR codes just contain the Apps Script /exec URL.
  function isBackendUrl(text) { return /^https:\/\/script\.google(usercontent)?\.com\/\S+$/i.test(String(text || "").trim()); }

  function connectWithUrl(url) {
    if (!url) { setConnStatus("Paste your Apps Script /exec URL above first", false); return; }
    BACKEND_URL = url;
    settingsUrlDraft = url;
    try { localStorage.setItem("qrCheckinBackendUrl", url); } catch (e) { /* fine without persistence */ }
    view.shareStep = 0;
    render();   // so Settings picks up the new link (and its "Show setup QR" button) straight away
    loadFromBackend();
  }

  // ---------- demo data: 100 made-up registrants (fake names, fake numbers) ----------
  // Built from a fixed seed, so the demo looks the same every time it loads.
  var initialState = (function () {
    var seed = 20260927;
    function rand() { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }
    function pick(arr) { return arr[Math.floor(rand() * arr.length)]; }
    function chance(p) { return rand() < p; }

    var FEMALE = ["Emma", "Grace", "Priya", "Hope", "Sophie", "Olivia", "Malia", "Sela", "Vika", "Rebecca", "Anika", "Zoe", "Charlotte", "Litia", "Ruby", "Mele", "Hannah", "Chloe", "Jasmine", "Leilani", "Ana", "Esther", "Paula", "Isla", "Mia", "Talia", "Georgia", "Amelia", "Losana", "Eliza"];
    var MALE = ["Josh", "Caleb", "Liam", "Tomasi", "Sione", "Isaac", "Nathan", "Wiremu", "Samuela", "Aaron", "Tevita", "Latu", "Ilaisa", "Daniel", "Zac", "Semisi", "Ethan", "Noah", "Jacob", "Sefo", "Mosese", "Oliver", "Lachlan", "Viliami", "Ben", "Levi", "Tyler", "Jonah", "Api", "Max"];
    var LAST = ["Whitfield", "Tanuvasa", "Nair", "Osei", "Kolinio", "Fatupaito", "Manu", "Petersen", "Singh", "Fifita", "Grant", "Robinson", "Cummins", "Hughes", "Anderson", "Turner", "Gupta", "Schmidt", "Lee", "Vaipulu", "Ross", "Reid", "Faleolo", "Nadan", "Taufa", "Stewart", "Wright", "Cook", "Ah Kuoi", "Bell", "Havili", "Moala", "Brown", "Latu", "Tupou", "Kaufusi", "Wilson", "Nguyen", "Mahe", "O'Brien"];
    var UNITS = [
      ["Mount Gravatt Ward", "Brisbane Stake"], ["Indooroopilly Ward", "Brisbane Stake"], ["Sunnybank Ward", "Brisbane Stake"], ["The Gap Ward", "Brisbane Stake"],
      ["Springwood Ward", "Logan Stake"], ["Marsden Ward", "Logan Stake"], ["Loganholme Ward", "Beenleigh Stake"], ["Beenleigh Ward", "Beenleigh Stake"],
      ["Capalaba Ward", "Redlands Stake"], ["Cleveland Ward", "Redlands Stake"], ["Victoria Point Ward", "Redlands Stake"],
      ["Redbank Plains Ward", "Ipswich Stake"], ["Goodna Ward", "Ipswich Stake"], ["Nerang Ward", "Gold Coast Stake"], ["Coomera Branch", "Gold Coast Stake"],
      ["Highfields Branch", "Toowoomba Stake"], ["Caboolture Ward", "Caboolture Stake"]
    ];
    var TEAMS = ["Team Red", "Team Blue", "Team Green", "Team Gold", "Team Silver"];
    var DIETS = ["Vegetarian", "Vegan", "Gluten-free", "Halal", "Nut allergy", "Dairy-free", "Pescatarian", "No pork or beef", "Shellfish allergy (severe)"];
    var PICKUPS = ["9:00 AM", "10:00 AM", "11:00 AM", "12:00 PM", "2:00 PM"];
    var CHECKIN_TIMES = ["8:42 AM", "8:55 AM", "9:06 AM", "9:14 AM", "9:21 AM", "9:37 AM", "9:48 AM", "10:02 AM", "10:15 AM", "10:31 AM"];
    var RELATION = ["mum", "dad", "sister", "brother", "aunt", "uncle", "bishop", "grandparent"];
    var STAY = ["On-site (University of Queensland)", "Off-site", "Host family"];
    var SIZES = ["XS", "S", "M", "L", "XL", "2XL"];
    var PAYMENT = ["Paid in full", "Paid in full", "Paid in full", "Deposit paid", "Unpaid"];

    var activities = [
      { id: "escape", name: "Escape Room Challenge", time: "Sat 10:00 AM", capacity: 20, otherBookings: 4 },
      { id: "choir", name: "Worship Night Rehearsal", time: "Sat 1:00 PM", capacity: 15, otherBookings: 2 },
      { id: "futsal", name: "Sports Tournament: Futsal", time: "Sat 2:30 PM", capacity: 24, otherBookings: 6 },
      { id: "service", name: "Service Project: Care Packages", time: "Sun 9:00 AM", capacity: 30, otherBookings: 3 },
      { id: "talent", name: "Talent Show Sign-ups", time: "Sat 7:30 PM", capacity: 12, otherBookings: 5 },
      { id: "hike", name: "Hike & Lookout Walk", time: "Sun 7:00 AM", capacity: 16, otherBookings: 1 }
    ];
    var taken = {};
    activities.forEach(function (a) { taken[a.id] = a.otherBookings; });

    var registrants = [];
    var usedNames = {};
    for (var i = 1; i <= 100; i++) {
      var female = i % 2 === 1;
      var first, last, name;
      do {
        first = pick(female ? FEMALE : MALE);
        last = pick(LAST);
        name = first + " " + last;
      } while (usedNames[name]);
      usedNames[name] = true;

      var unit = pick(UNITS);
      var id = "YSA-" + ("000" + i).slice(-4);
      var dietary = chance(0.25) ? pick(DIETS) : null;
      var needsPickup = chance(0.22);
      var checkedIn = chance(0.35);
      var qrPrinted = checkedIn || chance(0.5);
      var bookings = [];
      activities.forEach(function (a) {

        pickupTime: needsPickup ? pick(PICKUPS) : null,

      };

      var phone = "04" + Math.floor(10 + rand() * 90) + " 555 " + ("00" + Math.floor(rand() * 1000)).slice(-3);
      var contactPhone = "0400 555 " + ("00" + Math.floor(rand() * 1000)).slice(-3);
      var relation = pick(RELATION);
      r.details = [
        ["ID", r.id], ["Name", r.name], ["Gender", female ? "Female" : "Male"], ["Age", String(18 + Math.floor(rand() * 13))],
        ["Phone", phone], ["Email", (first + "." + last).toLowerCase().replace(/[^a-z.]/g, "") + i + "@example.com"],
        ["Ward", r.ward], ["Stake", r.stake], ["Dietary", r.dietary || ""],

        ["Accommodation", pick(STAY)], ["T-shirt size", pick(SIZES)], ["Payment", pick(PAYMENT)],

      ];
      // Checked in = every item on the check-in list is done. A few people are part-way through.
      r.packGiven = checkedIn || chance(0.1);
      r.packGivenAt = r.packGiven ? (r.checkedInAt || "9:50 AM") : null;
      r.shirtGiven = checkedIn;
      r.shirtGivenAt = r.shirtGiven ? r.checkedInAt : null;

    }

    // A couple of people reported lost, so the dashboard alert has something to show.
    [registrants[6], registrants[41]].forEach(function (r, k) {

  function clone(obj) { return JSON.parse(JSON.stringify(obj)); }
  function byId(arr, id) { for (var i = 0; i < arr.length; i++) { if (arr[i].id === id) return arr[i]; } return null; }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
    });
  }

  // ---------- profile photos ----------
  // r.photo is either an https image URL (stock photo / Drive thumbnail) or a data: URI
  // fetched lazily from the backend. If it's missing or fails to load, initials show instead.
  function initialsOf(name) {
    var parts = String(name || "").trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return "?";
    return (parts[0][0] + (parts.length > 1 ? parts[parts.length - 1][0] : "")).toUpperCase();
  }
  function avatarHtml(r, large) {
    var img = r.photo
      ? '<img src="' + esc(r.photo) + '" alt="" loading="lazy" referrerpolicy="no-referrer" data-photo-id="' + esc(r.id) + '">'
      : '';
    return '<span class="avatar' + (large ? ' avatar-lg' : '') + '" aria-hidden="true">' + esc(initialsOf(r.name)) + img + '</span>';
  }
  var photoRetried = {};
  // <img> error events don't bubble, so listen in the capture phase. On a failed load,
  // ask the backend once for the photo as base64 (works for private Drive files),
  // otherwise just remove the broken image so the initials show.
  document.addEventListener("error", function (e) {
    var img = e.target;
    if (!img || img.tagName !== "IMG" || !img.hasAttribute("data-photo-id")) return;
    var id = img.getAttribute("data-photo-id");
    var r = byId(state.registrants, id);
    if (img.parentNode) img.parentNode.removeChild(img);
    if (!r || photoRetried[id] || !BACKEND_URL || (r.photo || "").indexOf("data:") === 0) return;
    photoRetried[id] = true;
    fetch(BACKEND_URL + (BACKEND_URL.indexOf("?") === -1 ? "?" : "&") + "action=photo&id=" + encodeURIComponent(id))
      .then(function (x) { return x.json(); })
      .then(function (d) {
        if (d && d.ok && d.dataUri) { r.photo = d.dataUri; render(); }
      }).catch(function () { /* initials stay */ });
  }, true);

  function spotsTaken(activity) {
    var mine = 0;
    for (var i = 0; i < state.registrants.length; i++) {
      if (state.registrants[i].bookings.indexOf(activity.id) !== -1) mine++;
    }
    return activity.otherBookings + mine;
  }

  function capacityState(activity) {
    var taken = spotsTaken(activity);
    var ratio = taken / activity.capacity;
    var status = "ok";
    if (taken >= activity.capacity) status = "full";
    else if (ratio >= 0.8) status = "near";
    return { taken: taken, ratio: Math.min(ratio, 1), status: status };
  }

  function timeToMinutes(t) {
    if (!t) return 0;
    var m = t.match(/(\d+):(\d+)\s*(AM|PM)/i);
    if (!m) return 0;
    var h = parseInt(m[1], 10) % 12;
    var min = parseInt(m[2], 10);
    if (/PM/i.test(m[3])) h += 12;
    return h * 60 + min;
  }

  function nowTime() {
    var d = new Date();
    var h = d.getHours() % 12; if (h === 0) h = 12;
    var m = d.getMinutes();
    var ampm = d.getHours() >= 12 ? "PM" : "AM";
    return h + ":" + (m < 10 ? "0" : "") + m + " " + ampm;
  }

  // ---------- camera helpers ----------

  function stopCamera() {
    if (cameraRaf) { cancelAnimationFrame(cameraRaf); cameraRaf = null; }
    if (cameraStream) {
      cameraStream.getTracks().forEach(function (t) { t.stop(); });
      cameraStream = null;
    }
    if (cameraUnrecognizedTimer) { clearTimeout(cameraUnrecognizedTimer); cameraUnrecognizedTimer = null; }
  }

  function startCamera() {
    var video = document.getElementById("cameraVideo");
    var msgEl = document.getElementById("cameraMsg");
    var errEl = document.getElementById("cameraErrorBox");
    if (!video) return;

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      if (errEl) errEl.textContent = "This browser can't offer camera access here. Use the field below to type the ID printed on the lanyard instead.";
      return;
    }
    if (typeof jsQR !== "function") {
      if (errEl) errEl.textContent = "The QR-reading library didn't load in this preview. Use the field below to type the ID instead.";
      return;
    }

    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
      .then(function (stream) {
        if (view.screen !== "camera") { stream.getTracks().forEach(function (t) { t.stop(); }); return; }
        cameraStream = stream;
        video.srcObject = stream;
        video.setAttribute("playsinline", "true");
        video.play();
        cameraHiddenCanvas = document.createElement("canvas");
        if (msgEl) msgEl.textContent = cameraPrompt();
        cameraRaf = requestAnimationFrame(tickCamera);
      })
      .catch(function (err) {
        var msg = "Couldn't access the camera. Use the field below to type the ID instead.";
        if (err && err.name === "NotAllowedError") msg = "Camera permission was denied. Allow camera access, or type the ID below instead.";
        if (err && err.name === "NotFoundError") msg = "No camera was found on this device. Type the ID below instead.";
        if (errEl) errEl.textContent = msg;
      });
  }

  function tickCamera() {
    if (view.screen !== "camera" || !cameraStream) return;
    var video = document.getElementById("cameraVideo");
    if (video && video.readyState === video.HAVE_ENOUGH_DATA && video.videoWidth) {
      var scale = Math.min(1, 480 / video.videoWidth);
      var w = Math.max(1, Math.round(video.videoWidth * scale));
      var h = Math.max(1, Math.round(video.videoHeight * scale));
      cameraHiddenCanvas.width = w;
      cameraHiddenCanvas.height = h;
      var ctx = cameraHiddenCanvas.getContext("2d");
      ctx.drawImage(video, 0, 0, w, h);
      try {
        var imageData = ctx.getImageData(0, 0, w, h);
        var code = jsQR(imageData.data, w, h, { inversionAttempts: "dontInvert" });
        if (code && code.data) {
          handleDecodedId(code.data.trim());
          return; // handleDecodedId decides whether to keep scanning
        }
      } catch (e) { /* frame not ready yet — ignore and retry */ }
    }
    cameraRaf = requestAnimationFrame(tickCamera);
  }

  function cameraPrompt() {
    return view.cameraMode === "setup" ? "Point the camera at the setup QR code" : "Point the camera at a lanyard's QR code";
  }

  function handleDecodedId(text) {
    if (view.cameraMode === "setup" || isBackendUrl(text)) {
      if (isBackendUrl(text) && view.cameraMode === "setup") {
        stopCamera();
        view.cameraMode = null;
        view.screen = "tab";
        view.activeTab = "settings";
        settingsUrlDraft = text;
        render();
        connectWithUrl(text);
        return;
      }
      var sm = document.getElementById("cameraMsg");
      if (sm) sm.textContent = view.cameraMode === "setup"
        ? "That isn’t an Apps Script setup link — try again"
        : "That’s a setup code — scan it from Settings instead";
      if (cameraUnrecognizedTimer) clearTimeout(cameraUnrecognizedTimer);
      cameraUnrecognizedTimer = setTimeout(function () {
        var m = document.getElementById("cameraMsg");
        if (m && view.screen === "camera") m.textContent = cameraPrompt();
      }, 1800);
      cameraRaf = requestAnimationFrame(tickCamera);
      return;
    }
    var r =byId(state.registrants, text) || byId(state.registrants, text.toUpperCase());
    if (r) {
      stopCamera();
      scan(r.id);
      return;
    }
    if (isWalkinCode(text)) {
      stopCamera();
      openWalkin(text.toUpperCase());
      return;
    }
    var msgEl = document.getElementById("cameraMsg");
    if (msgEl) msgEl.textContent = "That code isn't recognized in this Sheet — try again";
    if (cameraUnrecognizedTimer) clearTimeout(cameraUnrecognizedTimer);
    cameraUnrecognizedTimer = setTimeout(function () {
      var m = document.getElementById("cameraMsg");
      if (m && view.screen === "camera") m.textContent = cameraPrompt();
    }, 1800);
    cameraRaf = requestAnimationFrame(tickCamera);
  }

  function makeQrCanvas(text, size) {
    var canvas = document.createElement("canvas");
    if (typeof QRious === "function") {
      /* eslint-disable no-new */
      new QRious({ element: canvas, value: text, size: size, background: "#ffffff", foreground: "#161b1e", level: "M" });
    } else {
      canvas.width = size; canvas.height = size;
      var ctx = canvas.getContext("2d");
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, size, size);
      ctx.fillStyle = "#161b1e"; ctx.font = "10px monospace";
      ctx.fillText(text, 6, size / 2);
    }
    return canvas;
  }

  // Shrink the photo to a small square-ish JPEG so it's quick to send and store.
  function loadWalkinPhoto(file) {
    var w = view.walkin;
    if (!w || !file) return;
    w.photoBusy = true; w.error = ""; render();
    var reader = new FileReader();
    reader.onerror = function () { w.photoBusy = false; w.error = "Couldn't read that photo — try taking it again."; render(); };
    reader.onload = function () {
      var img = new Image();
      img.onerror = function () { w.photoBusy = false; w.error = "Couldn't read that photo — try taking it again."; render(); };
      img.onload = function () {
        var max = 480;
        var scale = Math.min(1, max / Math.max(img.width, img.height));
        var cw = Math.max(1, Math.round(img.width * scale)), ch = Math.max(1, Math.round(img.height * scale));
        var c = document.createElement("canvas");
        c.width = cw; c.height = ch;
        c.getContext("2d").drawImage(img, 0, 0, cw, ch);
        w.photo = c.toDataURL("image/jpeg", 0.78);
        w.photoBusy = false;
        render();
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  function saveWalkin() {
    var w = view.walkin;
    if (!w || w.saving) return;
    w.name = w.name.replace(/\s+/g, " ").trim();
    w.ward = w.ward.replace(/\s+/g, " ").trim();
    if (!w.name) { w.error = "Type their name (the same as on their card)."; render(); return; }
    if (!w.photo) { w.error = "Take a photo of them first — it's how security can identify them later."; render(); return; }
    if (byId(state.registrants, w.id)) { w.error = w.id + " is already linked to someone. Give them a different blank card."; render(); return; }

    var rec = { id: w.id, name: w.name, ward: w.ward, photo: w.photo, at: nowTime(), synced: false };
    var finish = function (serverReg) {
      localWalkins[rec.id] = rec;
      saveLocalWalkins();
      var r = serverReg ? mapServerRegistrant(serverReg) : walkinToRegistrant(rec);
      if (!r.photo) r.photo = rec.photo;
      r.walkin = true;
      var existing = byId(state.registrants, rec.id);
      if (existing) Object.assign(existing, r); else state.registrants.push(r);
      lastUpdatedRegistrant = rec.id;
      view.walkin = null;
      scan(rec.id);
    };

    if (!BACKEND_URL) { finish(null); return; }
    w.saving = true; w.error = ""; render();
    setConnStatus("Saving walk-in…", false);
    apiPost({ action: "registerWalkin", id: rec.id, name: rec.name, ward: rec.ward, photo: rec.photo, at: rec.at })
      .then(function (res) {
        if (res && res.ok) {
          rec.synced = true;
          setConnStatus("Connected — live off the test Sheet", true);
          finish(res.registrant || null);
        } else if (res && res.error === "taken") {
          w.saving = false;
          w.error = rec.id + " is already linked to " + (res.name || "someone else") + " in the Sheet. Give them a different blank card.";
          setConnStatus("Connected — live off the test Sheet", true);
          render();
        } else {
          // Sheet script hasn't got the walk-in update yet — keep it on this phone and retry later.
          setConnStatus("Walk-in saved on this phone only — the Sheet script needs the walk-in update (" + (res && res.error) + ")", false);
          finish(null);
        }
      })
      .catch(function (err) {
        setConnStatus("Walk-in saved on this phone only — " + err + " (it'll send when the connection is back)", false);
        finish(null);
      });
  }

  // ---------- problem reports (Settings) ----------
  // Saved to a "Problems" tab in the Sheet. Without a backend (or if the Sheet script doesn't have the
  // problems update yet) they're kept on this phone so nothing typed is lost.
  var localProblems = [];
  try { localProblems = JSON.parse(localStorage.getItem("qrCheckinProblems") || "[]") || []; } catch (e) { localProblems = []; }
  function saveLocalProblems() { try { localStorage.setItem("qrCheckinProblems", JSON.stringify(localProblems)); } catch (e) { /* fine */ } }
  var reporterName = "";
  try { reporterName = localStorage.getItem("qrCheckinReporterName") || ""; } catch (e) { reporterName = ""; }
  var problemsList = null;      // last list shown on the View problems screen
  var problemsStatus = "";      // loading / error note for that screen

  function openProblemModal() {
    view.problemModal = { text: "", name: reporterName || staffName, sending: false, error: "", sent: false };
    render();
    var ta = document.getElementById("problemText");
    if (ta) ta.focus();
  }
  function closeProblemModal() {
    var wasSent = view.problemModal && view.problemModal.sent;
    view.problemModal = null;
    render();
    if (wasSent && view.screen === "problems") loadProblems();

  function submitProblem() {
    var pm = view.problemModal;
    if (!pm || pm.sending) return;
    pm.text = pm.text.trim();
    pm.name = pm.name.replace(/\s+/g, " ").trim();
    if (!pm.text) { pm.error = "Type what went wrong first."; render(); return; }
    reporterName = pm.name;
    try { localStorage.setItem("qrCheckinReporterName", reporterName); } catch (e) { /* fine */ }
    var p = { id: "P-" + Date.now().toString(36).toUpperCase(), at: nowTime(), by: pm.name, text: pm.text, status: "Open", resolvedAt: "", local: true };
    var keepLocal = function (note) {
      localProblems.unshift(p); saveLocalProblems();
      pm.sending = false; pm.sent = true; pm.note = note; render();
    };
    if (!BACKEND_URL) { keepLocal("Saved on this phone (not connected to a Sheet)."); return; }
    pm.sending = true; pm.error = ""; render();
    apiPost({ action: "reportProblem", id: p.id, by: p.by, text: p.text })
      .then(function (res) {
        if (res && res.ok) { pm.sending = false; pm.sent = true; pm.note = "Sent to the Problems tab in the Sheet."; render(); }
        else keepLocal("Saved on this phone only — the Sheet script needs the problems update (" + (res && res.error) + ").");
      })
      .catch(function (err) { keepLocal("Saved on this phone only — couldn’t reach the Sheet (" + err + ")."); });
  }

  function openProblems() {
    view.screen = "problems";
    problemsStatus = BACKEND_URL ? "Loading…" : "";
    render();
    loadProblems();
  }

  function loadProblems() {
    var local = localProblems.slice();
    if (!BACKEND_URL) { problemsList = local; problemsStatus = ""; render(); return; }
    apiGet("problems").then(function (d) {
      if (d && d.ok) { problemsList = (d.problems || []).concat(local); problemsStatus = ""; }
      else { problemsList = local; problemsStatus = "Couldn’t load the Problems tab — the Sheet script needs the problems update (" + (d && d.error) + "). Showing problems saved on this phone."; }
      if (view.screen === "problems") render();
    }).catch(function (err) {
      problemsList = local; problemsStatus = "Couldn’t reach the Sheet (" + err + "). Showing problems saved on this phone.";
      if (view.screen === "problems") render();
    });
  }

  function setProblemStatus(id, resolved) {
    var p = null;
    (problemsList || []).forEach(function (x) { if (x.id === id) p = x; });
    if (!p) return;
    p.status = resolved ? "Resolved" : "Open";
    p.resolvedAt = resolved ? nowTime() : "";
    p.resolvedBy = resolved ? reporterName : "";
    if (p.local) {
      localProblems.forEach(function (x) { if (x.id === id) { x.status = p.status; x.resolvedAt = p.resolvedAt; x.resolvedBy = p.resolvedBy; } });
      saveLocalProblems();
      render();
      return;
    }
    render();
    apiPost({ action: "setProblemStatus", id: id, status: p.status, by: reporterName }).then(function (res) {
      if (!(res && res.ok)) { problemsStatus = "Couldn’t update the Sheet (" + (res && res.error) + ")."; render(); }
    }).catch(function (err) { problemsStatus = "Couldn’t update the Sheet (" + err + ")."; render(); });
  }

  function walkinPrintHtml() {

    var used = state.registrants.filter(function (r) { return isWalkinCode(r.id); }).length;

  function printBlankCards() {
    var startEl = document.getElementById("walkinStart");

    var start = Math.max(1, Math.min(9999, parseInt(startEl && startEl.value, 10) || nextWalkinNumber()));
    var count = Math.max(1, Math.min(400, parseInt(countEl && countEl.value, 10) || gridFor(PSCOPE.walkin.st).perPage));
    if (start + count - 1 > 9999) count = 9999 - start + 1;
    view.walkinStart = start; view.walkinCount = count;
    var items = [];
    for (var i = 0; i < count; i++) items.push({ id: walkinCode(start + i), blank: true });
    renderPrintCards(items, PSCOPE.walkin.st);
    var last = start + count - 1;

    }

    window.print();

  function answerTask(c) {
    var r = byId(state.registrants, c.id);
    var t = findTask(c.task);
    if (!r || !t) { render(); return; }
    r[t.field] = c.next;
    r[t.atField] = c.next ? nowTime() : null;
    if (!localTasks[r.id]) localTasks[r.id] = {};
    if (c.next) localTasks[r.id][t.key] = r[t.atField]; else delete localTasks[r.id][t.key];
    saveLocalTasks();

    // Someone counts as checked in once every item on the list is done.
    var allDone = CHECKIN_TASKS.every(function (x) { return r[x.field]; });
    var checkInChange = null;
    if (allDone && !r.checkedIn) { r.checkedIn = true; r.checkedInAt = nowTime(); checkInChange = "checkin"; }
    else if (!allDone && r.checkedIn) { r.checkedIn = false; r.checkedInAt = null; checkInChange = "uncheckin"; }

    lastUpdatedRegistrant = r.id;
    render();
    if (BACKEND_URL) {
      apiPost({ action: "markTask", id: r.id, task: t.key, value: c.next }).then(function (res) {
        if (res && res.ok) setConnStatus("Connected \u2014 live off the test Sheet", true);
        else setConnStatus("Saved on this phone only \u2014 the Sheet script needs the check-in list update (" + (res && res.error) + ")", false);
        if (checkInChange) return apiPost({ action: checkInChange, id: r.id });
      }).then(function (res2) {
        if (res2 && !res2.ok && checkInChange === "uncheckin") setConnStatus("Undo saved on this phone only \u2014 the Sheet still shows them checked in", false);

  // ---------- print layout presets ----------
  var PAGE = { w: 210, h: 297, margin: 8 };   // A4 portrait, 8mm safe margin all round
  var BUILTIN_PRESETS = [
    { id: "lanyard4", name: "Lanyard 82×130 · 4 per page", cardW: 82, cardH: 130, gap: 10, qr: 50, nameSize: 22, topPad: 17, cutLines: true, showEvent: true, showTeam: false, showDietary: true, showId: true },
    { id: "lanyard4team", name: "Lanyard 82×130 · with team", cardW: 82, cardH: 130, gap: 10, qr: 46, nameSize: 22, topPad: 17, cutLines: true, showEvent: true, showTeam: true, showDietary: true, showId: true },
    { id: "big1", name: "Big card · 1 per page (A5)", cardW: 148, cardH: 210, gap: 10, qr: 90, nameSize: 40, topPad: 24, cutLines: true, showEvent: true, showTeam: true, showDietary: true, showId: true },
    { id: "proof", name: "Draft proof · small, saves paper", cardW: 56, cardH: 80, gap: 6, qr: 34, nameSize: 13, topPad: 8, cutLines: true, showEvent: false, showTeam: false, showDietary: true, showId: true },
    { id: "fold2", name: "Fold-over with photo · 2 per page", fold: true, cardW: 82, cardH: 130, gap: 0, qr: 50, nameSize: 22, topPad: 17, cutLines: true, showEvent: true, showTeam: false, showDietary: false, showId: true },
    { id: "walkin4", name: "Walk-in card 82×130 · 4 per page", cardW: 82, cardH: 130, gap: 10, qr: 50, nameSize: 26, topPad: 17, cutLines: true, showEvent: true, showTeam: false, showDietary: false, showId: true }
  ];
  var PRESET_FIELDS = ["cardW", "cardH", "gap", "qr", "nameSize", "topPad", "cutLines", "showEvent", "showTeam", "showDietary", "showId", "fold"];
  var customPresets = [];
  try { customPresets = JSON.parse(localStorage.getItem("qrCheckinPrintPresets") || "[]") || []; } catch (e) { customPresets = []; }

  // Two separate layout choices: registrant lanyards (Print tab) and blank walk-in cards
  // (Other > Walk-ins > Print blank cards). Saved layouts are shared; the choice and edits are not.
  var PSCOPE = {
    lanyard: { storeKey: "qrCheckinPrintActive", def: "lanyard4", id: null, st: null, edit: false },
    walkin:  { storeKey: "qrCheckinWalkinPrintActive", def: "walkin4", id: null, st: null, edit: false }
  };
  // which layout (lanyard / walkin) a clicked control belongs to
  function pscopeOf(el) { var box = el && el.closest ? el.closest("[data-pscope]") : null; return box ? box.getAttribute("data-pscope") : "lanyard"; }
  function scopeOf(name) { return PSCOPE[name === "walkin" ? "walkin" : "lanyard"]; }

  function allPresets() { return BUILTIN_PRESETS.concat(customPresets); }
  function findPreset(id) { var a = allPresets(); for (var i = 0; i < a.length; i++) { if (a[i].id === id) return a[i]; } return null; }
  function isCustom(id) { for (var i = 0; i < customPresets.length; i++) { if (customPresets[i].id === id) return true; } return false; }
  function persistPresets() {
    try {
      localStorage.setItem("qrCheckinPrintPresets", JSON.stringify(customPresets));
      Object.keys(PSCOPE).forEach(function (k) { localStorage.setItem(PSCOPE[k].storeKey, PSCOPE[k].id); });
    } catch (e) { /* fine without persistence */ }
  }
  function num(v, lo, hi, dflt) { v = parseFloat(v); if (!isFinite(v)) v = dflt; return Math.min(hi, Math.max(lo, v)); }
  function normalizeSettings(o) {
    // fold-over cards: each person is two panels side by side (front | photo), so a panel is at most half the page wide
    return {
      fold: !!o.fold,
      cardW: num(o.cardW, 30, o.fold ? PAGE.w / 2 : PAGE.w - 2 * PAGE.margin, 82),
      cardH: num(o.cardH, 30, PAGE.h - 2 * PAGE.margin, 130),
      gap: num(o.gap, 0, 30, 10),
      qr: num(o.qr, 15, 150, 50),
      nameSize: num(o.nameSize, 8, 60, 22),
      topPad: num(o.topPad, 0, 60, 17),
      cutLines: !!o.cutLines, showEvent: !!o.showEvent, showTeam: !!o.showTeam, showDietary: !!o.showDietary, showId: !!o.showId
    };
  }
  function presetSettings(pr) { var o = {}; PRESET_FIELDS.forEach(function (f) { o[f] = pr[f]; }); return normalizeSettings(o); }
  Object.keys(PSCOPE).forEach(function (k) {
    var sc = PSCOPE[k];
    var saved = null;
    try { saved = localStorage.getItem(sc.storeKey); } catch (e) { saved = null; }
    sc.id = saved && findPreset(saved) ? saved : sc.def;
    sc.st = presetSettings(findPreset(sc.id));
  });

  function gridFor(st) {
    if (st.fold) return { cols: 1, rows: Math.max(1, Math.floor((PAGE.h - 1) / st.cardH)), perPage: Math.max(1, Math.floor((PAGE.h - 1) / st.cardH)) };
    var cols = Math.max(1, Math.floor((PAGE.w - 2 * PAGE.margin + st.gap) / (st.cardW + st.gap)));
    var rows = Math.max(1, Math.floor((PAGE.h - 2 * PAGE.margin + st.gap) / (st.cardH + st.gap)));
    return { cols: cols, rows: rows, perPage: cols * rows };
  }
  function presetModified(scope) {
    var sc = scopeOf(scope), base = findPreset(sc.id);
    if (!base) return false;
    return JSON.stringify(presetSettings(base)) !== JSON.stringify(sc.st);
  }
  function selectPreset(scope, id) {
    var sc = scopeOf(scope), pr = findPreset(id);
    if (!pr) return;
    sc.id = id;
    sc.st = presetSettings(pr);
    persistPresets();
    render();
  }
  function setPresetField(scope, field, value) {
    if (PRESET_FIELDS.indexOf(field) === -1) return;
    var sc = scopeOf(scope);
    var o = clone(sc.st);
    o[field] = value;
    sc.st = normalizeSettings(o);
    render();
  }
  function savePresetNew(scope) {
    var sc = scopeOf(scope);
    var input = document.getElementById("presetName-" + scope);
    var name = (input && input.value || "").trim();
    if (!name) { if (input) input.focus(); return; }
    var pr = clone(sc.st);
    pr.id = "custom-" + Date.now().toString(36);
    pr.name = name;
    customPresets.push(pr);
    sc.id = pr.id;
    persistPresets();
    render();
  }
  function savePresetOver(scope) {
    var sc = scopeOf(scope);
    for (var i = 0; i < customPresets.length; i++) {
      if (customPresets[i].id === sc.id) {
        var keep = { id: customPresets[i].id, name: customPresets[i].name };
        customPresets[i] = Object.assign(keep, clone(sc.st));
      }
    }
    // the other place using this saved layout picks up the change too (unless it has its own unsaved edits)
    Object.keys(PSCOPE).forEach(function (k) {
      if (PSCOPE[k] !== sc && PSCOPE[k].id === sc.id && !presetModified(k)) PSCOPE[k].st = clone(sc.st);
    });
    persistPresets();
    render();
  }
  function deletePreset(scope) {
    var gone = scopeOf(scope).id;
    customPresets = customPresets.filter(function (p) { return p.id !== gone; });
    Object.keys(PSCOPE).forEach(function (k) {
      if (PSCOPE[k].id === gone) { PSCOPE[k].id = PSCOPE[k].def; PSCOPE[k].st = presetSettings(findPreset(PSCOPE[k].def)); }
    });
    persistPresets();
    render();
  }

      return '<option value="' + esc(p.id) + '"' + (p.id === sc.id ? ' selected' : '') + '>' + (isCustom(p.id) ? '★ ' : '') + esc(p.name) + '</option>';

    var pages = nCards ? Math.ceil(nCards / g.perPage) : 0;
    var summary = (st.fold

        '<div class="preset-summary">' + summary + '</div>' +
        '<button class="back-link" data-action="presetToggleEdit" type="button">' + (sc.edit ? 'Hide options ▴' : 'Customise ▾') + '</button>' +

  // Fold-over photo layout: each person is a strip of two panels — front (name + QR) | back (photo).
  // Strips are stacked from the very top-left corner of the A4 sheet, so you cut down the right, along the
  // bottom and between people, then fold each strip in half.
  function renderFoldCards(ids, st, container) {
    var g = gridFor(st);
    var page = null, onPage = 0;
    ids.forEach(function (id) {
      var r = typeof id === "string" ? byId(state.registrants, id) : id;
      if (!r || r.blank) return;
      if (!page || onPage === g.perPage) {
        page = document.createElement("div");
        page.className = "fold-page";
        container.appendChild(page);
        onPage = 0;
      }
      var strip = document.createElement("div");
      strip.className = "fold-strip";
      strip.style.top = (onPage * st.cardH) + "mm";

      var front = document.createElement("div");
      front.className = "fold-panel fold-front";
      if (st.showEvent) { var ev = document.createElement("div"); ev.className = "print-card-event"; ev.textContent = "Brisbane YSA Convention 2026"; front.appendChild(ev); }
      var nm = document.createElement("div"); nm.className = "print-card-name"; nm.textContent = r.name; front.appendChild(nm);
      if (st.showTeam && r.team) { var tm = document.createElement("div"); tm.className = "print-card-team"; tm.textContent = r.team; front.appendChild(tm); }
      front.appendChild(makeQrCanvas(r.id, 400));
      if (st.showDietary && r.dietary) { var dt = document.createElement("div"); dt.className = "print-card-dietary"; dt.innerHTML = "&#127869; DIETARY"; front.appendChild(dt); }
      if (st.showId) { var idEl = document.createElement("div"); idEl.className = "print-card-id"; idEl.textContent = r.id; front.appendChild(idEl); }

      var back = document.createElement("div");
      back.className = "fold-panel fold-back";
      if (r.photo) {
        var img = document.createElement("img");
        img.className = "fold-photo";
        img.alt = "";
        img.referrerPolicy = "no-referrer";
        img.setAttribute("data-print-photo-id", r.id);
        img.src = r.photo;
        back.appendChild(img);
      } else {
        var ph = document.createElement("div"); ph.className = "fold-photo fold-photo-empty"; ph.textContent = "PHOTO"; back.appendChild(ph);
      }
      var pn = document.createElement("div"); pn.className = "fold-photo-name"; pn.textContent = r.name; back.appendChild(pn);

      strip.appendChild(front);
      strip.appendChild(back);
      page.appendChild(strip);
      onPage++;
    });
    // cut / fold guides on every page, drawn for the number of people actually on it
    Array.prototype.forEach.call(container.querySelectorAll(".fold-page"), function (pg) {
      if (!st.cutLines) return;
      var n = pg.querySelectorAll(".fold-strip").length;
      var h = n * st.cardH, w = 2 * st.cardW;
      var add = function (cls, css, text) { var d = document.createElement("div"); d.className = cls; d.style.cssText = css; if (text) d.textContent = text; pg.appendChild(d); };
      add("fold-guide fold-guide-v", "left:" + w + "mm;top:0;height:" + h + "mm");
      add("fold-guide fold-guide-fold", "left:" + st.cardW + "mm;top:0;height:" + h + "mm");
      for (var i = 1; i <= n; i++) add("fold-guide fold-guide-h", "top:" + (i * st.cardH) + "mm;left:0;width:" + w + "mm");
      for (var j = 0; j < n; j++) add("fold-label", "left:" + (w + 2) + "mm;top:" + (j * st.cardH + st.cardH / 2) + "mm", "\u2702 cut");
      add("fold-label", "left:" + (st.cardW + 1) + "mm;top:" + (h + 1) + "mm", "fold");
    });
  }

  // Wait for photos on the print sheet before opening the print dialog. A photo that won't load
  // (e.g. a private Drive file) is fetched once through the Sheet script; anything still missing
  // after a few seconds prints as an empty PHOTO box.
  function whenPrintPhotosReady(done) {
    var imgs = Array.prototype.slice.call(document.querySelectorAll("#printSheet img[data-print-photo-id]"));
    if (!imgs.length) { done(); return; }
    var finished = false, left = imgs.length;
    var finish = function () { if (!finished) { finished = true; done(); } };
    var settle = function () { left--; if (left <= 0) finish(); };
    var giveUp = function (img) {
      var box = document.createElement("div"); box.className = "fold-photo fold-photo-empty"; box.textContent = "PHOTO";
      if (img.parentNode) img.parentNode.replaceChild(box, img);
    };
    imgs.forEach(function (img) {
      var tried = false;
      var onFail = function () {
        var id = img.getAttribute("data-print-photo-id");
        if (!tried && BACKEND_URL && id) {
          tried = true;
          fetch(BACKEND_URL + (BACKEND_URL.indexOf("?") === -1 ? "?" : "&") + "action=photo&id=" + encodeURIComponent(id))
            .then(function (x) { return x.json(); })
            .then(function (d) {
              if (d && d.ok && d.dataUri) { var r = byId(state.registrants, id); if (r) r.photo = d.dataUri; img.src = d.dataUri; }
              else { giveUp(img); settle(); }
            }).catch(function () { giveUp(img); settle(); });
          return;
        }
        giveUp(img); settle();
      };
      if (img.complete && img.naturalWidth) { settle(); return; }
      img.addEventListener("load", settle, { once: true });
      img.addEventListener("error", onFail);
    });
    setTimeout(function () {
      if (finished) return;
      imgs.forEach(function (img) { if (!(img.complete && img.naturalWidth)) giveUp(img); });
      finish();
    }, 8000);
  }

  function renderPrintCards(ids, st) {
    var container = document.getElementById("printSheet");
    container.innerHTML = "";
    container.classList.toggle("is-fold", !!st.fold);
    if (st.fold) { renderFoldCards(ids, st, container); return; }
    var g = gridFor(st);
    container.classList.toggle("no-cut", !st.cutLines);
    container.style.setProperty("--cw", st.cardW + "mm");
    container.style.setProperty("--ch", st.cardH + "mm");
    container.style.setProperty("--qr", st.qr + "mm");
    container.style.setProperty("--ns", st.nameSize + "pt");
    container.style.setProperty("--top", st.topPad + "mm");
    var page = null;
    var onPage = 0;
    ids.forEach(function (id) {
      var r = typeof id === "string" ? byId(state.registrants, id) : id;   // objects = blank walk-in cards
      if (!r) return;
      if (!page || onPage === g.perPage) {
        page = document.createElement("div");
        page.className = "print-page";
        page.style.gridTemplateColumns = "repeat(" + g.cols + ", " + st.cardW + "mm)";
        page.style.gridTemplateRows = "repeat(" + g.rows + ", " + st.cardH + "mm)";
        page.style.gap = st.gap + "mm";
        container.appendChild(page);
        onPage = 0;
      }
      var card = document.createElement("div");
      card.className = "print-card";

      if (st.showEvent) {
        var evEl = document.createElement("div"); evEl.className = "print-card-event"; evEl.textContent = "Brisbane YSA Convention 2026";
        card.appendChild(evEl);
      }
      if (r.blank) {
        // Walk-in card: empty box for them to write their name, then the QR and its code (always shown).
        card.classList.add("is-blank");
        var box = document.createElement("div"); box.className = "print-card-namebox";
        box.innerHTML = "<span>Name</span>";
        card.appendChild(box);
        card.appendChild(makeQrCanvas(r.id, 400));
        var bId = document.createElement("div"); bId.className = "print-card-id"; bId.textContent = r.id;
        card.appendChild(bId);
        page.appendChild(card);
        onPage++;
        return;
      }
      var nameEl = document.createElement("div"); nameEl.className = "print-card-name"; nameEl.textContent = r.name;
      card.appendChild(nameEl);
      if (st.showTeam && r.team) {
        var teamEl = document.createElement("div"); teamEl.className = "print-card-team"; teamEl.textContent = r.team;
        card.appendChild(teamEl);
      }

      card.appendChild(makeQrCanvas(r.id, 400));

      if (st.showDietary && r.dietary) {
        var dietEl = document.createElement("div");
        dietEl.className = "print-card-dietary";
        dietEl.innerHTML = "&#127869; DIETARY";
        card.appendChild(dietEl);
      }
      if (st.showId) {
        var idEl = document.createElement("div"); idEl.className = "print-card-id"; idEl.textContent = r.id;
        card.appendChild(idEl);
      }

      page.appendChild(card);
      onPage++;
    });
  }

  function finishPrint(ids) {
    lastPrintedBatch = ids.slice();
    view.printToast = ids.length + (ids.length === 1 ? " lanyard marked as printed." : " lanyards marked as printed.");
    view.selected = new Set();
    document.body.classList.add("printing");
    if (PSCOPE.lanyard.st.fold) {
      var doneMsg = view.printToast;
      whenPrintPhotosReady(function () { view.printToast = doneMsg; window.print(); });
      return;
    }
    window.print();
